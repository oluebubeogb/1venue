name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: venue
          POSTGRES_PASSWORD: venue
          POSTGRES_DB: venue_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U venue -d venue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://venue:venue@localhost:5432/venue_test
      JWT_SECRET: ci-only-not-a-secret
      AI_MOCK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          for f in $(git ls-files '*.js' | grep -v '^public/\|/client/'); do node --check "$f" || exit 1; done
      - name: Migrations apply on an empty database
        run: npm run migrate
      - run: npm test
